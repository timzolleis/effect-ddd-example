services:
  postgres:
    image: postgres:18-alpine
    container_name: effect-ddd-example-postgres
    environment:
      POSTGRES_USER: absence
      POSTGRES_PASSWORD: absence
      POSTGRES_DB: absence
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "absence"]
      interval: 1s
      retries: 30
